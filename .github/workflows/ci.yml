name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a release halfway through
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: intl
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - id: install
        run: composer install --ignore-platform-reqs --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: composer phpstan -- --no-progress --error-format=github

      - name: Rector
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer rector -- --dry-run

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer test -- --ci

  release:
    name: Release
    needs: check
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          npx --yes \
            --package semantic-release@25 \
            --package @semantic-release/git@11 \
            --package @semantic-release/changelog@7 \
            --package conventional-changelog-conventionalcommits@9 \
            semantic-release
